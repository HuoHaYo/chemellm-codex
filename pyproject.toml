[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemellm-codex"
version = "0.1.0"
description = "Chemical-engineering kernel and development workspace for a Codex integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pypdf==6.21.1",
  "thermo==0.6.1",
  "chemicals==1.5.2",
  "fluids==1.3.1",
  "CoolProp==8.0.0",
  "pint==0.26.1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "reportlab==5.0.1",
  "ezdxf>=1.4,<2",
  "openpyxl==3.1.5",
  "matplotlib>=3.9,<4",
  "Pillow>=10,<12",
  "pdfplumber==0.11.9",
  "pypdfium2==5.8.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
simulation = ["cantera==3.2.0", "ruamel.yaml==0.18.16"]

[tool.setuptools]
packages = ["app", "kernel"]
