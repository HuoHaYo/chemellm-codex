# The application and all project data remain local; this host serves public files only.
server {
    listen 80;
    listen [::]:80;
    server_name chemellm.online www.chemellm.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chemellm-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://chemellm.online$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chemellm.online;
    ssl_certificate /etc/letsencrypt/live/chemellm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chemellm.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://chemellm.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chemellm.online;
    root /var/www/chemellm-site/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/chemellm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chemellm.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChemELLMSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    # No proxy to the former workbench, APIs, configuration, or project files.
    location / { try_files $uri $uri/ =404; }
    location = /index.html { expires -1; }
    location ~* \.(css|js|svg)$ { expires 1h; }
    location ~ /\. { deny all; }

    access_log /var/log/nginx/chemellm.online.access.log;
    error_log /var/log/nginx/chemellm.online.error.log;
}
